<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartAssets — Digital Certificate of Authenticity</title>
  <meta name="description" content="Official SmartAssets Public Product Verification Page. Independently verify product identity, cryptographic digital signatures, inspection evidence, and blockchain ledger anchoring.">
  <link rel="icon" type="image/png" href="/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6C47FF;
      --primary-light: #8B6BFF;
      --primary-dark: #4F27E2;
      --cyan: #00F5D4;
      --teal: #10B981;
      --amber: #F59E0B;
      --rose: #E11D48;
      --slate-dark: #0F172A;
      --slate-muted: #64748B;
      --border: rgba(226, 232, 240, 0.9);
      --radius: 20px;
      --shadow: 0 10px 30px -5px rgba(30, 27, 75, 0.08), 0 4px 6px -2px rgba(30, 27, 75, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top left, #E4E0FF 0%, #F5DFEF 25%, #FFF5EF 50%, #FFFFFF 100%);
      background-attachment: fixed;
      color: var(--slate-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--slate-dark);
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .badge-registry {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: #10B981;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .badge-registry .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .spin-icon {
      animation: spin 1.1s linear infinite;
    }

    .cert-card {
      background: #FFFFFF;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 24px;
      position: relative;
    }

    .cert-ribbon {
      height: 6px;
      background: linear-gradient(90deg, #6C47FF 0%, #976af0 50%, #00F5D4 100%);
    }

    .cert-ribbon.revoked {
      background: linear-gradient(90deg, #E11D48 0%, #F43F5E 100%);
    }

    .cert-ribbon.draft {
      background: linear-gradient(90deg, #64748B 0%, #94A3B8 100%);
    }

    .cert-content {
      padding: 28px 24px;
    }

    .cert-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      border-bottom: 1px solid #F1F5F9;
      padding-bottom: 20px;
      margin-bottom: 20px;
    }

    .cert-kicker {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .cert-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--slate-dark);
    }

    .seal-badge {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      background: #ECFDF5;
      border: 1.5px solid #A7F3D0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #10B981;
      flex-shrink: 0;
    }

    .seal-badge.revoked {
      background: #FFF1F2;
      border-color: #FECDD3;
      color: #E11D48;
    }

    .seal-badge.draft {
      background: #F1F5F9;
      border-color: #CBD5E1;
      color: #64748B;
    }

    /* Warning Banner for Revoked or Draft */
    .banner-warning {
      background: #FFF1F2;
      border: 1px solid #FECDD3;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      color: #9F1239;
    }

    .banner-warning-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .banner-warning-desc {
      font-size: 12px;
      line-height: 1.4;
    }

    .banner-draft {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #92400E;
    }

    /* Hero Asset Row */
    .asset-hero {
      display: flex;
      gap: 18px;
      align-items: center;
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .asset-img {
      width: 84px;
      height: 84px;
      border-radius: 12px;
      object-fit: cover;
      background: #E2E8F0;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .asset-info {
      flex: 1;
      min-width: 0;
    }

    .asset-name {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .asset-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ECFDF5;
      color: #15803D;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #BBF7D0;
    }

    .asset-status-pill.unvaulted {
      background: #F1F5F9;
      color: #475569;
      border-color: #CBD5E1;
    }

    /* Specifications Grid */
    .spec-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (max-width: 480px) {
      .spec-grid {
        grid-template-columns: 1fr;
      }
    }

    .spec-box {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .spec-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--slate-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .spec-value {
      font-size: 13px;
      font-weight: 700;
      color: var(--slate-dark);
      word-break: break-word;
    }

    /* Proof Section Boxes */
    .section-card {
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      background: #FFFFFF;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid #F1F5F9;
      padding-bottom: 8px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .badge-verified {
      background: #DCFCE7;
      color: #15803D;
      border: 1px solid #86EFAC;
    }

    .badge-anchored {
      background: #ECFDF5;
      color: #047857;
      border: 1px solid #6EE7B7;
    }

    .badge-offchain {
      background: #F1F5F9;
      color: #475569;
      border: 1px solid #CBD5E1;
    }

    .badge-pending {
      background: #FEF3C7;
      color: #B45309;
      border: 1px solid #FCD34D;
    }

    .badge-revoked {
      background: #FFE4E6;
      color: #BE123C;
      border: 1px solid #FDA4AF;
    }

    .mono-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--slate-dark);
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      padding: 8px 10px;
      border-radius: 8px;
      word-break: break-all;
      margin-bottom: 8px;
    }

    .field-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .field-row .label {
      color: var(--slate-muted);
      font-weight: 600;
    }

    .field-row .val {
      font-weight: 700;
      color: var(--slate-dark);
    }

    .etherscan-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      margin-top: 6px;
    }

    .etherscan-link:hover {
      text-decoration: underline;
    }

    .disclaimer-text {
      font-size: 11px;
      color: #94A3B8;
      line-height: 1.4;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #F1F5F9;
    }

    /* Actions Bar */
    .actions-bar {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      height: 48px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(108, 71, 255, 0.3);
    }

    .btn-secondary {
      background: #FFFFFF;
      color: var(--slate-dark);
      border: 1px solid #E2E8F0;
    }

    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    footer {
      text-align: center;
      font-size: 11px;
      color: var(--slate-muted);
      margin-top: 32px;
      line-height: 1.6;
    }

    .state-wrap {
      background: #FFFFFF;
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    @media print {
      body { background: #FFFFFF; padding: 0; }
      .actions-bar, header .badge-registry { display: none !important; }
      .cert-card { box-shadow: none; border: 1px solid #CCC; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/" class="brand">
        <div class="brand-icon">
          <img
            id="brand-logo-img"
            src="/logo-mark.png"
            alt="SmartAssets"
            style="width: 36px; height: 36px; object-fit: contain; display: block;"
            onerror="
              if (!this.dataset.tried1) {
                this.dataset.tried1 = '1';
                this.src = '/verify/logo-mark.png';
              } else if (!this.dataset.tried2) {
                this.dataset.tried2 = '1';
                this.src = '/admin/logo-mark.png';
              } else if (!this.dataset.tried3) {
                this.dataset.tried3 = '1';
                this.src = '/logo.png';
              } else {
                this.style.display = 'none';
                var fb = document.getElementById('brand-logo-fallback');
                if (fb) fb.style.display = 'flex';
              }
            "
          />
          <div
            id="brand-logo-fallback"
            style="display: none; width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #6C47FF, #00F5D4); align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 18px; box-shadow: 0 4px 12px rgba(108, 71, 255, 0.25);"
          >
            S
          </div>
        </div>
        <span class="brand-name">SmartAssets</span>
      </a>
      <div class="badge-registry">
        <span class="dot"></span>
        <span>AUTHORITATIVE VERIFICATION</span>
      </div>
    </header>

    <main id="app">
      <div class="state-wrap">
        <div style="display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:50%; background:#F5F3FF; color:#6C47FF; margin-bottom:16px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="spin-icon">
            <line x1="12" y1="2" x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/>
            <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
            <line x1="2" y1="12" x2="6" y2="12"/>
            <line x1="18" y1="12" x2="22" y2="12"/>
            <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/>
            <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
          </svg>
        </div>
        <div style="font-weight:800; font-size:18px; margin-bottom:6px;">Verifying Digital Certificate</div>
        <div style="font-size:13px; color:#64748B;">Querying authoritative registry and validating cryptographic signature...</div>
      </div>
    </main>

    <footer>
      SmartAssets Verification Authority &bull; Cryptographic PKI &bull; Ethereum Sepolia Provenance Ledger
    </footer>
  </div>

  <script>
    (async function init() {
      const appEl = document.getElementById('app');

      // 1. Resolve asset ID from URL path (/verify/:id) or query parameter (?id=:id)
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      let assetId = null;

      if (pathParts.length >= 2 && pathParts[0] === 'verify') {
        assetId = pathParts[1];
      }
      if (!assetId) {
        const urlParams = new URLSearchParams(window.location.search);
        assetId = urlParams.get('id');
      }

      if (!assetId || !assetId.trim()) {
        showError('Missing Product Identifier', 'No product ID was supplied in the verification link. Please scan the official certificate QR code or provide a valid asset URL.');
        return;
      }

      assetId = assetId.trim();

      try {
        // Try fetching dedicated certificate dossier first
        let res = await fetch('/api/certificates/' + encodeURIComponent(assetId));
        let dossier = null;

        if (res.ok) {
          const data = await res.json();
          dossier = data?.dossier || null;
        }

        // Fallback to /api/assets/:id if certificates endpoint didn't find it
        if (!dossier) {
          res = await fetch('/api/assets/' + encodeURIComponent(assetId));
          if (!res.ok) {
            showError('Certificate Record Not Found', 'This product could not be found in the SmartAssets registry. The asset may have been delisted or the link is invalid.');
            return;
          }
          const assetData = await res.json();
          const asset = assetData?.asset;
          if (!asset) {
            showError('Invalid Record', 'The asset record returned by the registry is invalid or incomplete.');
            return;
          }
          // Convert asset to standardized dossier format
          dossier = buildDossierFromAsset(asset);
        }

        renderCertificateDossier(dossier);
      } catch (err) {
        console.error('Verification error:', err);
        showError('Network Error', 'Could not connect to the verification server. Please check your internet connection.');
      }

      function showError(title, message) {
        appEl.innerHTML = `
          <div class="state-wrap">
            <div style="display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; border-radius:50%; background:#FFF1F2; color:#E11D48; margin-bottom:16px;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
            </div>
            <div style="font-size:18px; font-weight:800; margin-bottom:6px;">${escapeHtml(title)}</div>
            <div style="font-size:13px; color:#64748B; margin-bottom:18px;">${escapeHtml(message)}</div>
            <button class="btn btn-secondary" onclick="window.location.reload()" style="max-width:180px; margin:0 auto;">Retry Connection</button>
          </div>
        `;
      }

      function buildDossierFromAsset(asset) {
        const hasTx = Boolean(asset.txHash && /^0x[0-9a-fA-F]{64}$/.test(asset.txHash));
        const isRevoked = Boolean(asset.certificateRevoked);
        let lifecycleStatus = asset.certificateLifecycleStatus || (isRevoked ? 'revoked' : (hasTx ? 'anchored' : (asset.certificateSignature ? 'issued' : 'draft')));

        return {
          found: true,
          assetId: asset.id,
          lifecycleStatus,
          product: {
            id: asset.id,
            name: asset.name,
            category: asset.category,
            condition: asset.condition,
            year: asset.year,
            image: asset.image,
            initialValuationZar: asset.price_num || 0,
          },
          certificate: asset.certificateSignature ? {
            certificateId: asset.certificateId || asset.cert,
            version: asset.certificateVersion || '1.0.0',
            issuedAt: asset.certificateIssuedAt,
            metadataDigest: asset.metadataDigest,
            signature: asset.certificateSignature,
            keyId: asset.certificateKeyId,
            algorithm: 'RSASSA-PKCS1-v1_5 / SHA-256',
            issuer: asset.certificateIssuer || { name: 'SmartAssets Verification Authority', id: 'smartassets-authority-org' },
            revocation: {
              revoked: isRevoked,
              revokedAt: asset.certificateRevokedAt,
              reason: asset.certificateRevocationReason,
            },
          } : null,
          evidence: asset.certificateEvidence ? {
            appraiserName: asset.certificateEvidence.appraiser_name || asset.appraiser || 'Not provided',
            inspectionRef: asset.certificateEvidence.inspection_ref || 'Not provided',
            inspectionDate: asset.certificateEvidence.inspection_date,
            inspectionStatus: asset.certificateEvidence.inspection_status || 'passed',
            physicalCustody: Boolean(asset.certificateEvidence.physical_custody),
            custodyFacility: asset.certificateEvidence.custody_facility || (asset.badge === 'Vault Secured' ? 'SmartAssets Custody Facility' : 'Not Vaulted'),
          } : null,
          blockchainAnchoring: hasTx ? {
            network: 'Ethereum Sepolia Testnet (Test Credential)',
            chainId: 11155111,
            contractAddress: asset.contractAddress || null,
            tokenId: asset.tokenId || null,
            txHash: asset.txHash,
            blockNumber: null,
            etherscanUrl: `https://sepolia.etherscan.io/tx/${asset.txHash}`,
            isTestnet: true,
          } : null,
          verification: {
            isValid: !isRevoked && Boolean(asset.certificateSignature),
            status: isRevoked ? 'revoked' : (asset.certificateSignature ? 'valid' : 'draft'),
            signatureVerified: Boolean(asset.certificateSignature),
            digestMatches: Boolean(asset.metadataDigest),
            reason: isRevoked ? asset.certificateRevocationReason : null,
          },
        };
      }

      function renderCertificateDossier(dossier) {
        const { product, certificate, evidence, blockchainAnchoring, verification, lifecycleStatus } = dossier;

        const isRevoked = lifecycleStatus === 'revoked' || verification?.status === 'revoked';
        const isDraft = lifecycleStatus === 'draft';
        const isAwaitingInspection = lifecycleStatus === 'awaiting_inspection';
        const isAnchored = lifecycleStatus === 'anchored';
        const isIssued = lifecycleStatus === 'issued';

        let headerKicker = 'SMARTASSETS VERIFIED CANONICAL';
        let headerTitle = 'Certificate of Authenticity';
        let sealIconSvg = `
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        `;
        let ribbonClass = '';
        let sealClass = '';

        if (isRevoked) {
          headerKicker = 'STATUS: FORMALLY REVOKED';
          headerTitle = 'Certificate of Authenticity (Revoked)';
          sealIconSvg = `
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E11D48" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          `;
          ribbonClass = 'revoked';
          sealClass = 'revoked';
        } else if (isDraft) {
          headerKicker = 'STATUS: DRAFT LISTING';
          headerTitle = 'Product Dossier (Uncertified)';
          // Clean document outline icon — NO PENCIL EMOJI OR ICON
          sealIconSvg = `
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          `;
          ribbonClass = 'draft';
          sealClass = 'draft';
        } else if (isAwaitingInspection) {
          headerKicker = 'STATUS: AWAITING INSPECTION';
          headerTitle = 'Appraisal in Progress';
          sealIconSvg = `
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          `;
          ribbonClass = 'draft';
          sealClass = 'draft';
        }

        const isVaulted = Boolean(evidence?.physicalCustody);
        const vaultText = isVaulted ? 'Physically Vaulted & Inspected' : 'Digital Claim (Item Not In Custody)';
        const imgUrl = product.image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&q=80';

        appEl.innerHTML = `
          <div class="cert-card">
            <div class="cert-ribbon ${ribbonClass}"></div>
            <div class="cert-content">
              
              <!-- Header -->
              <div class="cert-header">
                <div>
                  <div class="cert-kicker">${escapeHtml(headerKicker)}</div>
                  <div class="cert-title">${escapeHtml(headerTitle)}</div>
                </div>
                <div class="seal-badge ${sealClass}">${sealIconSvg}</div>
              </div>

              <!-- Revoked Banner -->
              ${isRevoked ? `
                <div class="banner-warning">
                  <div class="banner-warning-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                      <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/>
                      <line x1="12" y1="8" x2="12" y2="12"/>
                      <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span>CERTIFICATE REVOKED BY ISSUING AUTHORITY</span>
                  </div>
                  <div class="banner-warning-desc">
                    <strong>Revocation Reason:</strong> ${escapeHtml(certificate?.revocation?.reason || 'Administrative revocation')}<br>
                    <strong>Revocation Date:</strong> ${escapeHtml(certificate?.revocation?.revokedAt ? new Date(certificate.revocation.revokedAt).toLocaleString() : 'Recorded')}<br>
                    This certificate is null and void and must not be accepted as valid proof of authenticity.
                  </div>
                </div>
              ` : ''}

              <!-- Draft / Uncertified Banner -->
              ${isDraft ? `
                <div class="banner-warning banner-draft">
                  <div class="banner-warning-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="10"/>
                      <line x1="12" y1="16" x2="12" y2="12"/>
                      <line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                    <span>DRAFT RECORD — NO CERTIFICATE ISSUED</span>
                  </div>
                  <div class="banner-warning-desc">
                    This item has been listed by a marketplace seller, but has not yet undergone formal inspection or been issued a signed digital certificate. No authenticity claim is made.
                  </div>
                </div>
              ` : ''}

              <!-- Awaiting Inspection Banner -->
              ${isAwaitingInspection ? `
                <div class="banner-warning banner-draft">
                  <div class="banner-warning-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="10"/>
                      <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span>PHYSICAL INSPECTION PENDING</span>
                  </div>
                  <div class="banner-warning-desc">
                    This item is currently undergoing appraisal by an authorized gemologist or horologist. Digital certificate issuance is pending verified inspection results.
                  </div>
                </div>
              ` : ''}

              <!-- Product Hero Card -->
              <div class="asset-hero">
                <img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(product.name || 'Product')}" class="asset-img" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&q=80'">
                <div class="asset-info">
                  <div class="asset-name">${escapeHtml(product.name || 'Identified Luxury Item')}</div>
                  <div class="asset-status-pill ${isVaulted ? '' : 'unvaulted'}">
                    ${isVaulted ? `
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                      </svg>
                    ` : `
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                      </svg>
                    `}
                    <span>${escapeHtml(vaultText)}</span>
                  </div>
                </div>
              </div>

              <!-- Product Specifications Grid -->
              <div class="spec-grid">
                <div class="spec-box">
                  <div class="spec-label">STABLE PRODUCT ID</div>
                  <div class="spec-value" style="font-family:monospace; font-size:11px;">${escapeHtml(product.id || 'N/A')}</div>
                </div>
                <div class="spec-box">
                  <div class="spec-label">CATEGORY</div>
                  <div class="spec-value">${escapeHtml((product.category || 'Not provided').toUpperCase())}</div>
                </div>
                <div class="spec-box">
                  <div class="spec-label">CONDITION</div>
                  <div class="spec-value">${escapeHtml(product.condition || 'Not provided')}</div>
                </div>
                <div class="spec-box">
                  <div class="spec-label">MANUFACTURE YEAR</div>
                  <div class="spec-value">${escapeHtml(product.year ? String(product.year) : 'Not provided')}</div>
                </div>
              </div>

              <!-- 1. Issuing Organization & Authority Section -->
              <div class="section-card">
                <div class="section-header">
                  <div class="section-title">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M3 21h18M3 10h18M5 10v11M19 10v11M9 10v11M15 10v11M12 2L2 7h20L12 2z"/>
                    </svg>
                    <span>Certificate Issuer</span>
                  </div>
                  <div class="status-badge ${certificate ? 'badge-verified' : 'badge-offchain'}">
                    ${certificate ? 'OFFICIAL ISSUER' : 'UNISSUED'}
                  </div>
                </div>
                <div class="field-row">
                  <span class="label">Issuing Authority:</span>
                  <span class="val">${escapeHtml(certificate?.issuer?.name || 'SmartAssets Verification Authority')}</span>
                </div>
                <div class="field-row">
                  <span class="label">Certificate ID:</span>
                  <span class="val">${escapeHtml(certificate?.certificateId || 'Unassigned')}</span>
                </div>
                <div class="field-row">
                  <span class="label">Version &amp; Standard:</span>
                  <span class="val">SmartAssets Cert v${escapeHtml(certificate?.version || '1.0.0')} (RS256 PKI)</span>
                </div>
                <div class="field-row">
                  <span class="label">Issuance Timestamp:</span>
                  <span class="val">${certificate?.issuedAt ? new Date(certificate.issuedAt).toUTCString() : 'Pending Issuance'}</span>
                </div>
              </div>

              <!-- 2. Inspection & Physical Evidence Section -->
              <div class="section-card">
                <div class="section-header">
                  <div class="section-title">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="11" cy="11" r="8"/>
                      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                      <path d="M11 8v6M8 11h6"/>
                    </svg>
                    <span>Inspection Evidence &amp; Custody</span>
                  </div>
                  <div class="status-badge ${isVaulted ? 'badge-verified' : 'badge-offchain'}">
                    ${isVaulted ? 'VAULT SECURED' : 'CUSTODY PENDING'}
                  </div>
                </div>
                <div class="field-row">
                  <span class="label">Authorized Appraiser:</span>
                  <span class="val">${escapeHtml(evidence?.appraiserName || 'Not provided')}</span>
                </div>
                <div class="field-row">
                  <span class="label">Inspection Reference:</span>
                  <span class="val">${escapeHtml(evidence?.inspectionRef || 'Not recorded')}</span>
                </div>
                <div class="field-row">
                  <span class="label">Physical Custody:</span>
                  <span class="val">${isVaulted ? 'Deposited in SmartAssets Custody Vault' : 'Physical possession remains with lister'}</span>
                </div>
                <div class="field-row">
                  <span class="label">Facility Location:</span>
                  <span class="val">${escapeHtml(evidence?.custodyFacility || 'Not Vaulted')}</span>
                </div>
                <div class="disclaimer-text" style="display:flex; align-items:flex-start; gap:6px;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:2px;">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
                  </svg>
                  <div><strong>Physical Custody Guarantee:</strong> Authenticity appraisal reflects physical evaluation performed on the recorded inspection date. A digital certificate or token proves registry provenance, but physical condition post-inspection requires insured vault custody.</div>
                </div>
              </div>

              <!-- 3. Cryptographic Signature & PKI Seal Section -->
              <div class="section-card" style="background:#F0FDF4; border-color:#BBF7D0;">
                <div class="section-header" style="border-bottom-color:#DCFCE7;">
                  <div class="section-title" style="color:#166534;">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <span>Cryptographic Signature &amp; PKI Seal</span>
                  </div>
                  <div class="status-badge ${verification?.isValid ? 'badge-verified' : (isRevoked ? 'badge-revoked' : 'badge-offchain')}">
                    ${verification?.isValid ? 'SIGNATURE VALID (RS256)' : (isRevoked ? 'REVOKED' : 'UNSIGNED')}
                  </div>
                </div>
                
                <div class="field-row">
                  <span class="label" style="color:#166534;">Signer Key ID:</span>
                  <span class="val" style="font-family:monospace; color:#14532D;">${escapeHtml(certificate?.keyId || 'Not signed')}</span>
                </div>

                <div style="font-size:10px; font-weight:800; color:#166534; text-transform:uppercase; margin-top:8px; margin-bottom:4px;">
                  Canonical Metadata Digest (SHA-256)
                </div>
                <div class="mono-value" style="background:#FFFFFF; color:#14532D; border-color:#86EFAC;">
                  ${escapeHtml(certificate?.metadataDigest || 'Uncomputed')}
                </div>

                ${certificate?.signature ? `
                  <div style="font-size:10px; font-weight:800; color:#166534; text-transform:uppercase; margin-top:8px; margin-bottom:4px;">
                    Digital Signature (RSASSA-PKCS1-v1_5 / SHA-256)
                  </div>
                  <div class="mono-value" style="background:#FFFFFF; color:#14532D; border-color:#86EFAC; font-size:10px;">
                    ${escapeHtml(certificate.signature)}
                  </div>
                ` : ''}

                <div class="disclaimer-text" style="color:#15803D; border-top-color:#DCFCE7; display:flex; align-items:flex-start; gap:6px;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:2px;">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                  <div>Signed with RSA-2048 private key held in server HSM/keystore. Verifiable independently by third parties using the public key published at <code>/api/certificates/keys</code>.</div>
                </div>
              </div>

              <!-- 4. Blockchain Ledger Anchoring Section -->
              <div class="section-card">
                <div class="section-header">
                  <div class="section-title">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="2" y="2" width="8" height="8" rx="2"/>
                      <rect x="14" y="2" width="8" height="8" rx="2"/>
                      <rect x="8" y="14" width="8" height="8" rx="2"/>
                      <line x1="6" y1="10" x2="6" y2="12"/>
                      <line x1="18" y1="10" x2="18" y2="12"/>
                      <line x1="6" y1="12" x2="12" y2="12"/>
                      <line x1="18" y1="12" x2="12" y2="12"/>
                      <line x1="12" y1="12" x2="12" y2="14"/>
                    </svg>
                    <span>Blockchain Ledger Anchoring</span>
                  </div>
                  <div class="status-badge ${blockchainAnchoring ? 'badge-anchored' : 'badge-offchain'}">
                    ${blockchainAnchoring ? 'SEPOLIA ANCHORED (TEST CREDENTIAL)' : 'OFF-CHAIN REGISTRY'}
                  </div>
                </div>

                <div class="field-row">
                  <span class="label">Network:</span>
                  <span class="val">${escapeHtml(blockchainAnchoring?.network || 'Off-Chain Custodial Registry')}</span>
                </div>

                <div class="field-row">
                  <span class="label">Smart Contract:</span>
                  <span class="val" style="font-family:monospace; font-size:11px;">
                    ${escapeHtml(blockchainAnchoring?.contractAddress || 'None (Off-Chain)')}
                  </span>
                </div>

                <div class="field-row">
                  <span class="label">Token ID:</span>
                  <span class="val">${blockchainAnchoring?.tokenId ? '#' + escapeHtml(blockchainAnchoring.tokenId) : 'Not Minted'}</span>
                </div>

                ${blockchainAnchoring?.txHash ? `
                  <div style="font-size:10px; font-weight:800; color:#64748B; text-transform:uppercase; margin-top:8px; margin-bottom:4px;">
                    Transaction Hash (Ethereum Sepolia)
                  </div>
                  <div class="mono-value">
                    ${escapeHtml(blockchainAnchoring.txHash)}
                  </div>
                  <a href="${escapeHtml(blockchainAnchoring.etherscanUrl)}" target="_blank" rel="noopener noreferrer" class="etherscan-link">
                    <span>View verified mint transaction on Sepolia Etherscan</span>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="7" y1="17" x2="17" y2="7"/>
                      <polyline points="7 7 17 7 17 17"/>
                    </svg>
                  </a>
                ` : `
                  <div style="font-size:11px; color:#64748B; margin-top:6px;">
                    Sealed in SmartAssets Custodial Ledger. Not anchored on Ethereum Sepolia.
                  </div>
                `}

                <div class="disclaimer-text" style="display:flex; align-items:flex-start; gap:6px;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:2px;">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
                  </svg>
                  <div><strong>Blockchain Record Scope:</strong> Blockchain anchoring permanently stamps the certificate digest and product ID to Ethereum Sepolia Testnet. The blockchain confirms cryptographic data preservation; it does not replace physical inspection.</div>
                </div>
              </div>

            </div>
          </div>

          <!-- Actions Bar -->
          <div class="actions-bar">
            <button class="btn btn-secondary" onclick="window.print()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 6 2 18 2 18 9"/>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                <rect x="6" y="14" width="12" height="8"/>
              </svg>
              <span>Print / Save PDF</span>
            </button>
            <button class="btn btn-primary" onclick="copyVerificationLink()">
              <span id="copy-btn-icon" style="display:inline-flex; align-items:center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
              </span>
              <span id="copy-btn-text">Share Verification Link</span>
            </button>
          </div>
        `;
      }

      window.copyVerificationLink = function() {
        const url = window.location.href;
        const linkSvg = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        `;
        const checkSvg = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        `;
        navigator.clipboard.writeText(url).then(() => {
          const textEl = document.getElementById('copy-btn-text');
          const iconEl = document.getElementById('copy-btn-icon');
          if (textEl) textEl.textContent = 'Link Copied!';
          if (iconEl) iconEl.innerHTML = checkSvg;
          setTimeout(() => {
            if (textEl) textEl.textContent = 'Share Verification Link';
            if (iconEl) iconEl.innerHTML = linkSvg;
          }, 2500);
        }).catch(() => {
          alert('Verification Link: ' + url);
        });
      };

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
    })();
  </script>
</body>
</html>
